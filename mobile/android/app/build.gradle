plugins { id 'com.android.application' }

android { namespace 'app.marginalia.mobile'; compileSdk 36
    defaultConfig { applicationId 'app.marginalia.mobile'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
